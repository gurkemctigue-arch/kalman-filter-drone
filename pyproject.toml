[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-target-following"
version = "0.1.0"
description = "Portable RGB-D UAV target tracking and following research scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7", "PyYAML>=6", "matplotlib>=3.6"]
research = ["PyYAML>=6", "matplotlib>=3.6"]

[project.scripts]
uav-follow-demo = "uav_tracking.simulation:main"

[tool.setuptools.packages.find]
include = ["uav_tracking*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
