# Requested recorder receive histories for small evidence messages.
# Keep the latest Clock instead of replaying its backlog after a recorder stall.
# Intermediate Clock updates may be dropped; original time/evidence gates apply.
/clock:
  history: keep_last
  depth: 1
  reliability: reliable
  durability: volatile
/fmu/out/vehicle_odometry:
  history: keep_last
  depth: 1024
  reliability: best_effort
  durability: transient_local
/vehicle/odometry_timing:
  history: keep_last
  depth: 1024
  reliability: reliable
  durability: volatile
/vehicle/odometry:
  history: keep_last
  depth: 1024
  reliability: reliable
  durability: volatile
/tracking/flight_phase:
  history: keep_last
  depth: 256
  reliability: reliable
  durability: volatile
