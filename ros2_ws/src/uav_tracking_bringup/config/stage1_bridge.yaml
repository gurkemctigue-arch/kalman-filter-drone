# ros_gz_bridge parameter_bridge configuration for stage1_single_target.sdf.
# The RGB-D sensor uses a single topic prefix in SDF.  If a Gazebo release
# expands sensor topics under /world/.../model/..., inspect `gz topic -l` and
# change only the gz_topic_name fields; ROS topic names stay stable for the
# detector node.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/color/image_raw"
  gz_topic_name: "/camera/rgbd/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/aligned_depth_to_color/image_raw"
  gz_topic_name: "/camera/rgbd/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/camera/color/camera_info"
  gz_topic_name: "/camera/rgbd/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
- ros_topic_name: "/ground_truth/poses"
  gz_topic_name: "/ground_truth/poses"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
